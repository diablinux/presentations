<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive, keyboard-friendly presentation.">
  <title>New Talk — Slides</title>
</head>
<body class="text-slate-200">
  <div id="bg"></div>
  <header class="fixed inset-x-0 top-0 z-40 flex h-14 items-center justify-between border-b border-white/5 bg-slate-950/55 px-4 backdrop-blur-md md:px-8">
    <div class="flex items-center gap-3">
      <span class="text-sm font-semibold tracking-tight text-white" data-deck-title>New Talk</span>
    </div>
    <div class="flex items-center gap-2">
      <span id="counter" class="hidden font-mono text-xs tabular-nums text-slate-500 sm:inline"></span>
      <button id="presenterBtn" type="button" class="hidden h-9 items-center rounded-lg border border-white/10 bg-white/5 px-3 text-sm text-slate-300 transition hover:bg-white/10 hover:text-white md:inline-flex" aria-label="Open presenter view">Presenter</button>
      <button id="menuBtn" type="button" class="flex h-9 w-9 items-center justify-center rounded-lg border border-white/10 bg-white/5 text-slate-300 transition hover:bg-white/10 hover:text-white" aria-label="Open outline">Outline</button>
    </div>
  </header>
  <div class="fixed inset-x-0 top-0 z-50 h-[3px] bg-white/5">
    <div id="progress" class="h-full w-0 bg-gradient-to-r from-k8s-500 via-k8s-400 to-cyan-400 transition-[width] duration-500 ease-out"></div>
  </div>
  <main id="deck" class="fixed inset-0 z-10" aria-label="Presentation slides" aria-live="polite"></main>
  <footer class="fixed inset-x-0 bottom-0 z-40 flex h-16 items-center justify-between border-t border-white/5 bg-slate-950/55 px-4 backdrop-blur-md md:px-8">
    <button id="exportPdf" type="button" class="rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-300 hover:bg-white/10" aria-label="Export to PDF">PDF</button>
    <div class="hidden items-center gap-2 text-xs text-slate-600 sm:flex"><kbd>←</kbd><kbd>→</kbd><span>navigate</span> · <kbd>M</kbd> outline · <kbd>F</kbd> fullscreen</div>
    <div class="flex items-center gap-2">
      <button id="prev" type="button" class="rounded-lg border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-300 disabled:opacity-30" aria-label="Previous slide">Prev</button>
      <span id="counterMobile" class="font-mono text-xs tabular-nums text-slate-500 sm:hidden"></span>
      <button id="next" type="button" class="rounded-lg border border-k8s-500/40 bg-k8s-500/20 px-3 py-2 text-sm font-medium text-k8s-100 disabled:opacity-30" aria-label="Next slide">Next</button>
    </div>
  </footer>
  <div id="scrim" class="fixed inset-0 z-40 hidden bg-black/60 backdrop-blur-sm"></div>
  <aside id="menu" class="fixed inset-y-0 right-0 z-50 flex w-80 max-w-[85vw] translate-x-full flex-col border-l border-white/10 bg-slate-950/95 backdrop-blur-xl transition-transform duration-300 ease-out">
    <div class="flex h-14 shrink-0 items-center justify-between border-b border-white/5 px-5">
      <span class="text-[11px] font-semibold uppercase tracking-[0.25em] text-slate-400">Outline</span>
      <button id="menuClose" type="button" class="rounded-lg px-2 py-1 text-slate-300 hover:bg-white/10" aria-label="Close outline">Close</button>
    </div>
    <nav id="menuList" class="flex-1 overflow-y-auto p-3"></nav>
  </aside>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
